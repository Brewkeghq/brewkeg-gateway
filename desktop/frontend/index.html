<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brewkeg Gateway</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button class="update" id="update" hidden type="button">
      <span class="update-dot" aria-hidden="true"></span>
      <span id="update-text"></span>
    </button>

    <main>
      <p class="brand"><img class="brand-mark" src="icons/brewkeg.png" alt="" width="28" height="28" /><span class="brand-name">Brewkeg Gateway</span></p>

      <h1>Connect your tools.</h1>

      <section class="card tight">
        <div class="field">
          <input id="apikey" type="password" spellcheck="false" autocomplete="off" placeholder="API key" />
          <button class="btn-quiet" id="check" type="button">Test</button>
          <button class="btn-quiet" id="peek" type="button">Show</button>
        </div>
        <p class="field-note" id="key-note"><span id="key-label">No key yet?</span>
          <button class="linkish" id="get-key" type="button">brewkeg.dev/dashboard/keys</button>
        </p>
      </section>

      <p class="checkline" id="checkline" hidden></p>

      <section class="card tight">
        <ul class="services" id="services"></ul>
      </section>

      <!-- No primary button. A switch is the whole control: turning one on adds
           that tool, turning it off removes it, and each change is backed up
           first and can be undone from the docket. A separate "Connect 3 tools"
           step meant the user had to compose a selection and then commit it,
           which is work the switches already did. -->
      <!-- Announced, not just shown: a switch that moves immediately needs to
           say why nothing else is happening while the file is written. -->
      <p class="busyline" id="busy" role="status" aria-live="polite" hidden></p>

      <div class="actions">
        <p class="promise">
          <span id="promise">Switch a tool on to point it at brewkeg.</span>
          <span class="version" id="version"></span>
        </p>
      </div>

      <section class="docket" id="docket" hidden>
        <div class="docket-head">
          <span id="backup-id"></span>
          <span class="stamp">backed up</span>
        </div>
        <ul class="docket-lines" id="docket-lines"></ul>
        <!-- One line, only when a service still needs the user. Per-row manual
             steps buried the outcome this panel exists to show. -->
        <p class="docket-note" id="docket-note" hidden></p>
        <div class="restart" id="restart" hidden>
          <p class="restart-title" id="restart-title">Restart to apply</p>
          <ul id="restart-list"></ul>
          <button class="btn-quiet" id="copy-restart" type="button">Copy</button>
        </div>
        <div class="docket-actions">
          <button class="btn-quiet" id="undo" type="button">Undo</button>
        </div>
      </section>

      <p class="note" id="note" hidden></p>

      <!-- Developer mode. Hidden until the menu reveals it, but the banner is
           the opposite: it stays visible for as long as the app is pointed
           somewhere that is not brewkeg.dev, because the next switch writes
           that URL into real config files. -->
      <p class="devbanner" id="devbanner" hidden></p>

      <section class="devpanel" id="devpanel" hidden>
        <div class="dev-row">
          <input id="dev-url" type="text" spellcheck="false" autocomplete="off"
                 placeholder="http://localhost:3000" />
          <button class="btn-quiet" id="dev-save" type="button">Save</button>
        </div>
        <p class="dev-note" id="dev-note">
          The gateway URL the app talks to <em>and</em> writes into your tool configs.
          Leave empty to go back to <span id="dev-default">brewkeg.dev</span>.
        </p>
        <div class="dev-actions">
          <button class="btn-quiet" id="dev-test" type="button">Test</button>
          <button class="btn-quiet" id="dev-off" type="button">Developer mode off</button>
        </div>
      </section>

      <p class="foot">
        <button class="linkish" id="repo" type="button">github.com/brewkeghq/brewkeg-gateway</button>
        <span class="legal">© 2026 brewkeg · proprietary</span>
      </p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
