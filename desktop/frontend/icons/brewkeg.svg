<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- brewkeg favicon: the keg from /brand/icon-transparent.png, simplified for
       16px. The full illustration loses its silhouette at favicon size, so this
       keeps only what survives: cream barrel, dark green band, the </>.

       Colors are sampled from the brand art (dark #166534 / #14532d, cream
       #f0fdf4) so the tab, the header logo, and the OG card stay one palette. -->
  <rect width="32" height="32" rx="7" fill="#14532d"/>
  <!-- barrel rims + body -->
  <rect x="5.5" y="7" width="21" height="3" rx="1.5" fill="#f0fdf4"/>
  <rect x="5.5" y="22" width="21" height="3" rx="1.5" fill="#f0fdf4"/>
  <rect x="7" y="9.5" width="18" height="13" rx="3.5" fill="#f0fdf4"/>
  <!-- code brackets, stroked rather than filled so they survive 16px -->
  <g fill="none" stroke="#166534" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="12.5,13.5 9.5,16 12.5,18.5"/>
    <line x1="17.5" y1="13" x2="14.5" y2="19"/>
    <polyline points="19.5,13.5 22.5,16 19.5,18.5"/>
  </g>
</svg>
