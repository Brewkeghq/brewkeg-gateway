name: cli-release

# Tests are a gate, not a step inside the release job. A failing test in the
# same job as GoReleaser means the release either never happens or half
# happens, and on a branch push there is no signal at all until someone cuts a
# tag. `test` therefore runs on every push and every pull request, and both
# publishing jobs declare `needs: test` — so nothing can ship without it.
on:
  push:
    branches: ['main']
    # Plain semver, NOT `cli-v1.2.3`. GoReleaser parses the tag itself and
    # hard-fails with "failed to parse tag as semver" on any prefix — there is
    # no tag_pattern option to strip one. So the release tag is v0.2.0.
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cli

      - uses: actions/setup-go@v5
        with:
          # go.mod declares `go 1.25.0`. An older toolchain refuses the module
          # outright, so this must track go.mod rather than sit at 1.22.
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - name: Vet
        working-directory: cli
        run: go vet ./...

      - name: Test
        working-directory: cli
        run: go test ./... -count=1 -race

  # The CLI binaries. GoReleaser publishes these.
  #
  # The repo root IS the Go module root (`cli/go.mod` on GitHub == this
  # module), so `path: cli` in the checkout is what lines the workspace up
  # with the layout the local developer sees. Every `run` step then carries
  # `working-directory: cli` — the GoReleaser action itself is `uses:` and
  # therefore CANNOT take a working-directory (actionlint catches that, and
  # GitHub rejects the entire workflow file for it).
  cli:
    needs: test
    # This workflow now also runs on plain branch pushes, which is what makes
    # the gate useful. GoReleaser must not: without this it would cut a release
    # on every commit to main.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cli

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      # Belt and braces. `needs: test` already gated this, but GoReleaser runs
      # `go mod tidy` as a before-hook and then builds, so a re-vet here means a
      # build failure is never mistaken for a green release.
      - name: Vet
        working-directory: cli
        run: go vet ./...

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          install-only: true

      - name: Release
        working-directory: cli
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The desktop app. Wails builds each OS natively, so this has to run on a
  # runner per platform; the artefacts are attached to the release the CLI job
  # already created.
  desktop:
    needs: cli
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            package: desktop/build/bin/brewkeg-gateway.app
          - os: windows-latest
            platform: windows/amd64
            package: desktop/build/bin/brewkeg-gateway.exe
          - os: ubuntu-latest
            platform: linux/amd64
            package: desktop/build/bin/brewkeg-gateway
    runs-on: ${{ matrix.os }}
    # Declared at job level because a step's `if:` cannot read `secrets.*`
    # directly. Empty string when no cert is configured, which is exactly what
    # the signing steps test to decide whether to run.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
    steps:
      # Same `path: cli` reasoning as the job above: the module root is the
      # repo root, so `go vet ./...` and `../assets/appicon.png` only resolve
      # if the checkout lands in a `cli` subdirectory of the workspace.
      - uses: actions/checkout@v4
        with:
          path: cli

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '20'

      # Wails' Linux build links GTK and WebKitGTK through cgo. The GitHub
      # runner image does not carry the -dev headers, so the build fails at
      # pkg-config — a missing-toolchain error, not a code error. ubuntu-24.04
      # is where webkit2gtk-4.0 is the right series; ubuntu-22.04 shipped
      # 4.1 and needed a different pkg-config name.
      - name: Install GTK and WebKit dev packages
        if: runner.os == 'Linux'
        working-directory: cli
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Wails
        working-directory: cli
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test
        working-directory: cli
        run: go vet ./... && go test ./... -count=1

      - name: Build app
        working-directory: cli/desktop
        run: |
          mkdir -p build
          cp ../assets/appicon.png build/appicon.png
          wails build -clean -platform ${{ matrix.platform }}

      # An unsigned .app downloaded from a browser lands with the quarantine
      # xattr, and Gatekeeper refuses to open it: "Apple could not verify ...
      # is free of malware". That is not malware and not a false positive we can
      # suppress in code — it is a missing signature. Only a Developer ID
      # Application certificate plus notarisation clears it. The step is
      # conditional so a fork with no certs still builds; the release it makes
      # is simply unsigned and users must right-click → Open.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        working-directory: cli/desktop
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/brewkeg.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_PASSWORD" | openssl base64 -d -out "$CERT"

          # A throwaway keychain, deleted in `always:` cleanup below. The
          # default login keychain is not importable without a GUI session on a
          # runner.
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"

          # --deep is deprecated and would sign our own nested code with the
          # outer identity. Wails puts one Mach-O in Contents/MacOS and the
          # web assets are resources, so an explicit single-binary sign is
          # both correct and verifiable.
          codesign --force --timestamp --options runtime \
            --entitlements entitlements.plist \
            --sign "Developer ID Application: brewkeg ($APPLE_TEAM_ID)" \
            build/bin/brewkeg-gateway.app
          codesign --verify --deep --strict --verbose=2 build/bin/brewkeg-gateway.app

          # Notarise the .app, not the zip. Apple rejects a zip outright, and
          # stapling has to happen on the bundle before ditto copies it.
          ditto -c -k --keepParent build/bin/brewkeg-gateway.app "$RUNNER_TEMP/submit.zip"
          xcrun notarytool submit "$RUNNER_TEMP/submit.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple build/bin/brewkeg-gateway.app
          xcrun stapler validate build/bin/brewkeg-gateway.app
          spctl --assess --type execute --verbose=2 build/bin/brewkeg-gateway.app

      - name: Clean up signing material
        if: always() && runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/brewkeg.p12"

      # Windows SmartScreen shows "Windows protected your PC" for any unsigned
      # EXE. An Authenticode signature from a CA-issued cert is the fix;
      # self-signed certificates make the warning worse, not better, because
      # SmartScreen trusts the chain, not the presence of a signature.
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        working-directory: cli/desktop
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'brewkeg.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          # A 64-bit cert must sit in the 64-bit store; importing it into the
          # 32-bit view finds no root and fails with an unhelpful error.
          $sig = (Get-Command signtool.exe -ErrorAction Stop).Source
          & $sig sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f $pfx /p $env:WINDOWS_CERT_PASSWORD build/bin/brewkeg-gateway.exe
          & $sig verify /pa /v build/bin/brewkeg-gateway.exe
          Remove-Item $pfx -Force

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: cli/desktop/build/bin
        run: ditto -c -k --keepParent brewkeg-gateway.app "brewkeg-gateway_${GITHUB_REF_NAME}_macos.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: cli/desktop/build/bin
        run: 7z a "brewkeg-gateway_${GITHUB_REF_NAME}_windows.zip" brewkeg-gateway.exe

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: cli/desktop/build/bin
        run: tar czf "brewkeg-gateway_${GITHUB_REF_NAME}_linux.tar.gz" brewkeg-gateway

      - name: Attach to release
        shell: bash
        working-directory: cli/desktop/build/bin
        run: |
          # The name built above, matched exactly. The previous version derived
          # the Windows name differently from the one it packaged (`tr -d 'v'`),
          # so it only ever attached by falling back to "newest file in dir".
          case "${{ runner.os }}" in
            macOS) asset="brewkeg-gateway_${GITHUB_REF_NAME}_macos.zip" ;;
            Windows) asset="brewkeg-gateway_${GITHUB_REF_NAME}_windows.zip" ;;
            *) asset="brewkeg-gateway_${GITHUB_REF_NAME}_linux.tar.gz" ;;
          esac
          if [ ! -f "$asset" ]; then
            echo "expected asset missing: $asset" >&2
            ls -la >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}